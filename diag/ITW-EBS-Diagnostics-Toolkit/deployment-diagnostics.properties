# MERGE these entries into the active deployment.properties. Do not replace it.
# Remove/update existing entries for the same keys so each key occurs once.
# Keep the existing runtime, proxy, security and application configuration.
deployment.log=true
deployment.log.headers=true
deployment.log.file=true
deployment.log.file.clientapp=true
deployment.log.stdstreams=true
deployment.console.startup.mode=SHOW
# Leave deployment.user.logdir unchanged to preserve the current location.
# Default: C:/Users/<user>/.config/icedtea-web/log
